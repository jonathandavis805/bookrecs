name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (root)
        run: bun install

      - name: Install dependencies (web)
        run: bun install
        working-directory: web

      - name: Build frontend
        run: bun run build
        working-directory: web

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Run database migrations
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Create tracking table if it doesn't exist
          wrangler d1 execute bookrecs-db --remote --yes --command="
            CREATE TABLE IF NOT EXISTS schema_migrations (
              filename TEXT PRIMARY KEY,
              applied_at INTEGER NOT NULL DEFAULT (unixepoch())
            )
          "
          
          for migration in $(ls migrations/*.sql | sort); do
            filename=$(basename "$migration")
            # Check if already applied
            result=$(wrangler d1 execute bookrecs-db --remote --yes --json --command="SELECT filename FROM schema_migrations WHERE filename = '$filename'")
            
            if echo "$result" | grep -q "\"filename\":\"$filename\""; then
              echo "✓ Skipping $filename (already applied)"
            else
              echo "→ Applying $migration"
              wrangler d1 execute bookrecs-db --file="$migration" --remote --yes
              wrangler d1 execute bookrecs-db --remote --yes --command="INSERT INTO schema_migrations (filename) VALUES ('$filename')"
              echo "✓ $filename applied"
            fi
          done

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=bookrecs

      - name: Verify custom domain
        run: |
          echo "Custom domain bookrecs.dev is configured for this Pages project."
          echo "Ensure the CNAME record points to bookrecs.pages.dev in Cloudflare DNS."
