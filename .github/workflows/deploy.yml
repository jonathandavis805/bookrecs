name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a PR supersedes its running check. Deploys on main are never
# cancelled mid-way (migrations), only queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (root)
        run: bun install

      - name: Install dependencies (web)
        run: bun install
        working-directory: web

      # Lint, format, typecheck and dead-code checks; ~3s, so it shares this job instead of a separate runner.
      - name: Check
        run: bun run check

      - name: Build frontend
        run: bun run build
        working-directory: web

      - name: Run database migrations
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run migrate:remote

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=bookrecs

      - name: Verify custom domain
        run: |
          echo "Custom domain bookrecs.dev is configured for this Pages project."
          echo "Ensure the CNAME record points to bookrecs.pages.dev in Cloudflare DNS."
